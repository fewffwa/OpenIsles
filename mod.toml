# Fields that end up in the mod's manifest.
[manifest]
id = "OpenIsles"
version = "1.0.0"
display_name = "OpenIsles"
description =  "Fully unlocks every level, kong, and move in the game without unlocking any collectables."
short_description = "Fully unlocks every level, kong, and move in the game."
authors = [ "Fewffwa" ]
game_id = "dk64"
minimum_recomp_version = "1.0.0"

# Inputs to the mod tool.
[inputs]
elf_path = "build/mod.elf"
mod_filename = "unlock_mystery_menu"
func_reference_syms_file = "Dk64Syms/dump.toml"
data_reference_syms_files = [ "Dk64Syms/data_dump.toml" ]
additional_files = ["thumb.dds"]